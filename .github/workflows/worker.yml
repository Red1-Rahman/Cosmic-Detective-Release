name: worker

# Started by the start-worker Netlify function (via the GitHub API) when a new
# processing job is queued. It can also be started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A run that is queued behind another still finds any jobs
# left in the queue when it starts.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run worker until the queue is empty
        run: python worker/spherex_worker.py --drain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPHEREX_BUCKET: spherex-products
          WORKER_ID: github-actions
          WORKER_DOWNLOAD_CONCURRENCY: "6"
          WORKER_POLL_SECONDS: "3"
          WORKER_IDLE_GRACE_SECONDS: "20"
