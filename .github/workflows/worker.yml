# .github/workflows/worker.yml
name: worker

on:
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_REQUIREMENTS: worker/requirements.txt
      WORKER_CMD: python worker/main.py   # EDIT to match the CMD in Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - name: Check requirements file exists
        run: |
          test -f "$WORKER_REQUIREMENTS" || { echo "Missing $WORKER_REQUIREMENTS"; ls -R worker; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.WORKER_REQUIREMENTS }}

      - run: pip install -r "$WORKER_REQUIREMENTS"

      - name: Run worker
        run: timeout 8m $WORKER_CMD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPHEREX_BUCKET: spherex-products
          WORKER_ID: github-actions
          WORKER_DOWNLOAD_CONCURRENCY: "6"
